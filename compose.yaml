
services:
  minecraft:
    image: itzg/minecraft-server:java25
    container_name: minecraft-paper
    restart: unless-stopped

    ports:
      - "25565:25565"

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "LATEST"
      MEMORY: "4G"
      ONLINE_MODE: "FALSE"
      LEVEL: "world"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      OPS: "NotSaikat"
      MAX_PLAYERS: "8"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"

    volumes:
      - ./server-data:/data

    init: true
    stdin_open: true
    tty: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cap_add:
      - SETUID
      - SETGID

    pids_limit: 512
    mem_limit: 5g
